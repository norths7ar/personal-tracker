[project]
name = "personal-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "langchain-core==1.2.25",
    "langchain-openai==1.1.12",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "uvicorn==0.52.4",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "ruff==0.16.0",
]
