[project]
name = "personal-tracker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi==0.141.1",
    "langchain-core==1.2.25",
    "langchain-openai==1.1.12",
    "uvicorn==0.52.4",
]

[tool.ruff]
target-version = "py314"
line-length = 100
indent-width = 4
extend-exclude = [".tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
dev = [
    "ruff==0.17.4",
]
